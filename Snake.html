<html>
  <head>
    <title>Mario Snake</title>
    <link rel="stylesheet" href="Snake.css">
    <script src="HelperLibrary.js"></script>
    <script src="Snake.js"></script>
  </head>
  <body>

    <!-- Декоративные облака на фоне -->
    <div class="cloud" style="top:10px; left:5%">☁</div>
    <div class="cloud" style="top:30px; right:8%">☁</div>
    <div class="cloud" style="top:80px; left:15%">☁</div>

    <h1>Mario Snake</h1>

    <div id="ui">
      <span id="level_display">Level: 1</span>
      <span id="score_display">Score: 0</span>
      <span id="timer_display">Time: 30</span>
    </div>

    <div id="grid_id" class="grid"></div>

    <div class="buttonGroup">
      <button onclick="StartGame()" class="start">Start Game</button>
    </div>

    <!-- Нижняя земля в стиле Марио -->
    <div class="ground-bar"></div>

    <!-- Оверлей для смены уровня и Game Over (без alert!) -->
    <div id="level_overlay">
      <div id="overlay_text">Level 2!</div>
    </div>

  </body>
</html>
